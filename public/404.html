<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting · F1 Gender Reveal Grand Prix</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404s back to root with query preservation
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;
      window.location.replace(
        window.location.origin +
        path.substring(0, path.lastIndexOf('/') + 1) +
        (search || '') +
        (hash || '')
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Grand Prix...</p>
  </body>
</html>
